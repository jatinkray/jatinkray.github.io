<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Space Grotesk";
    font-style: normal;
    font-weight: 300 700;
    src: url("../fonts/SpaceGrotesk.woff2") format("woff2-variations");
  }
  @font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 400 600;
    src: url("../fonts/JetBrainsMono.woff2") format("woff2-variations");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Space Grotesk", sans-serif;
    background: #0b0d0e;
    color: #eceff1;
    position: relative;
  }
  .amb {
    position: absolute; inset: 0;
    background:
      radial-gradient(700px 380px at 85% -5%, rgba(52,211,153,0.10), transparent 70%),
      radial-gradient(500px 300px at 0% 100%, rgba(125,211,252,0.05), transparent 70%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(52,211,153,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(52,211,153,0.05) 1px, transparent 1px);
    background-size: 52px 52px;
  }
  .content {
    position: relative; z-index: 2;
    padding: 66px 78px;
    display: flex; flex-direction: column; height: 100%;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px; letter-spacing: 0.12em;
    color: #34d399;
    border: 1px solid rgba(52,211,153,0.35);
    background: rgba(52,211,153,0.07);
    padding: 9px 18px; border-radius: 999px;
    width: fit-content;
  }
  .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; }
  h1 {
    margin-top: 44px;
    font-size: 84px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.02;
  }
  h1 .accent { color: #34d399; }
  .sub {
    margin-top: 22px;
    font-family: "JetBrains Mono", monospace;
    font-size: 21px; color: #b7c2c6; letter-spacing: -0.01em;
  }
  .sub .dim { color: #515b60; }
  .kpis {
    margin-top: auto;
    display: flex; gap: 0;
    border-top: 1px solid #1e2429;
    padding-top: 28px;
  }
  .kpis .k { padding-right: 54px; }
  .kpis .k + .k { padding-left: 54px; border-left: 1px solid #1e2429; }
  .kpis .v {
    font-size: 36px; font-weight: 700; color: #34d399; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .kpis .v.gold { color: #e8b64c; }
  .kpis .l {
    margin-top: 7px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px; color: #7d8a8f; letter-spacing: 0.1em;
  }
  .foot {
    position: absolute; bottom: 40px; right: 78px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13.5px; color: #515b60; letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="amb"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="tag"><span class="dot"></span>STAFF SRE · PLATFORM LEADERSHIP · DUBAI</div>
    <h1>Jatin <span class="accent">·kumar·</span> Ray</h1>
    <div class="sub">
      Reliability engineering at the scale of a billion calls a day<span class="dim"> — 14+ years, 3 clouds, zero drama.</span>
    </div>
    <div class="kpis">
      <div class="k"><div class="v">1B+</div><div class="l">API CALLS / DAY</div></div>
      <div class="k"><div class="v gold">$2M</div><div class="l">SAVED / YEAR</div></div>
      <div class="k"><div class="v">99.5%</div><div class="l">API UPTIME</div></div>
      <div class="k"><div class="v">2</div><div class="l">PRODUCTS SHIPPED</div></div>
    </div>
  </div>
  <div class="foot">jatinkray.github.io</div>
</body>
</html>
